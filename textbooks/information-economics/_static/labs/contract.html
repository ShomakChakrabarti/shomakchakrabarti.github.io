<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']], tags: 'none' },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code','input','output'] }
};

<style>
/* Layout: a book page. Sticky contents rail on the left, one reading column (~68ch),
   and a wider "lab" band for the interactive contract explorer. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#1A2130; --muted:#5A6375; --rule:#DCE0E7;
  --accent:#22508F; --accent-soft:#E7EEF8;
  --why:#0E7465; --why-soft:#E5F3F0;
  --tool:#9A6110; --tool-soft:#FAF1E2;
  --warn:#A3392E; --warn-soft:#FAEAE7;
  --good:#2C7A47; --good-soft:#E6F3EA;
  --f-text:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11151C; --surface:#181E27; --ink:#E5E8ED; --muted:#9AA3B3; --rule:#2B3340;
  --accent:#8DB2EE; --accent-soft:#1D2A3E;
  --why:#5CC5B2; --why-soft:#15302C;
  --tool:#E2A84C; --tool-soft:#33291A;
  --warn:#EC8A7D; --warn-soft:#3A1F1C;
  --good:#71C48D; --good-soft:#1A3223; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#181E27; --ink:#E5E8ED; --muted:#9AA3B3; --rule:#2B3340;
  --accent:#8DB2EE; --accent-soft:#1D2A3E;
  --why:#5CC5B2; --why-soft:#15302C;
  --tool:#E2A84C; --tool-soft:#33291A;
  --warn:#EC8A7D; --warn-soft:#3A1F1C;
  --good:#71C48D; --good-soft:#1A3223; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:17px;line-height:1.62;margin:0}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:48px;max-width:1180px;margin:0 auto;padding-inline:24px;padding-block:32px 96px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr);gap:20px;padding-inline:16px;padding-block:20px 72px}}

/* contents rail */
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start;font-family:var(--f-ui);font-size:13.5px;max-height:calc(100vh - 48px);overflow:auto}
nav.toc .book{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
nav.toc .chap{font-weight:600;margin-bottom:14px;line-height:1.35}
nav.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;counter-reset:s 0}
nav.toc a{display:block;padding:5px 10px;border-radius:6px;color:var(--muted);text-decoration:none;border-left:2px solid transparent}
nav.toc a:hover{color:var(--ink);background:var(--accent-soft)}
nav.toc a.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
nav.toc .tools{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule);display:grid;gap:8px}
@media (max-width:900px){nav.toc{position:static;max-height:none}nav.toc ol{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}

main{min-width:0}
.col{max-width:68ch}
header.chapter{border-bottom:1px solid var(--rule);padding-bottom:24px;margin-bottom:8px}
.eyebrow{font-family:var(--f-ui);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-size:clamp(30px,4.4vw,44px);line-height:1.12;margin:.2em 0 .35em;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:27px;line-height:1.2;margin:2.4em 0 .5em;text-wrap:balance;scroll-margin-top:20px}
h2 .num{font-family:var(--f-num);font-size:.6em;color:var(--muted);font-weight:400;margin-right:.6em;vertical-align:.15em}
h3{font-size:20px;margin:1.8em 0 .4em;text-wrap:balance}
p{margin:.7em 0}
.lede{font-size:19px;color:var(--muted)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ui{font-family:var(--f-ui)}
.small{font-size:14.5px}
.muted{color:var(--muted)}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;padding:2px 0;margin:.8em 0!important}

/* formal blocks */
.formal{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 20px;margin:1.2em 0}
.formal > .lab{font-family:var(--f-ui);font-size:13px;font-weight:600;letter-spacing:.02em;margin-bottom:4px}
.thm{border-color:color-mix(in srgb,var(--accent) 45%,var(--rule))}
.thm > .lab{color:var(--accent)}
.defn > .lab{color:var(--muted)}
.thm em,.thm i{font-style:italic}
.toolbox{background:var(--tool-soft);border:1px solid color-mix(in srgb,var(--tool) 40%,transparent);border-radius:8px;padding:14px 18px;margin:1.2em 0}
.toolbox > .lab{font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--tool)}
.pit{background:var(--warn-soft);border-radius:8px;padding:12px 18px;margin:1.2em 0}
.pit > .lab{font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--warn)}
.strategy{border-left:3px solid var(--why);padding:4px 0 4px 16px;margin:1.2em 0}
.strategy > .lab{font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--why)}
.adv{border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);border-radius:8px;padding:12px 18px;margin:1.2em 0;font-size:15.5px}

/* toolkit cards */
.tk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:1.2em 0}
@media (max-width:700px){.tk{grid-template-columns:minmax(0,1fr)}}
.tk > div{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--tool);border-radius:6px;padding:12px 14px;font-size:15px;min-width:0}
.tk b{font-family:var(--f-ui);font-size:13.5px;display:block;margin-bottom:4px}
.chip{display:inline-block;font-family:var(--f-ui);font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:1px 7px;border-radius:999px;background:var(--tool-soft);color:var(--tool);text-decoration:none;white-space:nowrap;vertical-align:.1em}
.chip.why{background:var(--why-soft);color:var(--why)}

/* proofs */
.proof{background:var(--surface);border:1px solid var(--rule);border-radius:8px;margin:1.2em 0;overflow:hidden}
.proof-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--rule);font-family:var(--f-ui);font-size:13.5px}
.proof-head .t{font-weight:600}
.proof-head .ctl{display:flex;gap:6px;flex-wrap:wrap}
button{font-family:var(--f-ui);font-size:13px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.primary:hover{color:var(--surface);filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:default}
.pstep{padding:12px 16px 14px;border-bottom:1px solid var(--rule)}
.pstep:last-of-type{border-bottom:0}
.pstep > h4{font-family:var(--f-ui);font-size:14px;margin:0 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pstep > h4 .n{font-family:var(--f-num);color:var(--muted);font-weight:400}
.pstep.locked > :not(h4){display:none}
.pstep.locked > h4{color:var(--muted);font-weight:500}
.pstep.locked > h4::after{content:"hidden";font-family:var(--f-ui);font-weight:400;font-size:11.5px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:0 6px}
.why{background:var(--why-soft);border-radius:6px;padding:8px 12px;margin:.6em 0 .2em;font-size:15px}
.why::before{content:"Why this step? ";font-family:var(--f-ui);font-weight:600;font-size:12.5px;color:var(--why)}
.qed{text-align:right;color:var(--muted);padding:0 16px 10px;font-size:15px}
details.think{margin:.6em 0;font-size:15.5px}
details.think > summary{font-family:var(--f-ui);font-size:13px;color:var(--why);cursor:pointer;font-weight:600}

/* tables */
.tbl{overflow-x:auto;margin:1em 0}
table{border-collapse:collapse;font-size:15px;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--f-ui);font-size:12.5px;letter-spacing:.03em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.verdict{font-family:var(--f-ui);font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.v-hold{background:var(--good-soft);color:var(--good)}
.v-fit{background:var(--accent-soft);color:var(--accent)}
.v-part{background:var(--tool-soft);color:var(--tool)}
.v-fail{background:var(--warn-soft);color:var(--warn)}

/* lab */
.lab-band{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px;margin:1.4em 0}
.lab-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:start}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
#labTable td:first-child{min-width:11em}
@media (max-width:820px){.lab-grid{grid-template-columns:minmax(0,1fr)}}
.ctrls{display:grid;gap:12px;align-content:start;font-family:var(--f-ui);font-size:13.5px;min-width:0}
.ctrl label{display:flex;justify-content:space-between;gap:8px}
.ctrl label output{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.lab-out{min-width:0;display:grid;gap:14px}
.lab-svg{width:100%;height:auto;display:block;background:var(--bg);border-radius:8px}
.lab-svg text{font-family:var(--f-ui);font-size:11px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font-family:var(--f-ui);min-width:0}
.kpi .k{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.kpi .v{font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;margin-top:2px}
.pill{display:inline-block;font-family:var(--f-ui);font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}
.p-high{background:var(--good-soft);color:var(--good)}
.p-low{background:var(--warn-soft);color:var(--warn)}
.msg{font-family:var(--f-ui);font-size:13px;color:var(--warn)}
.ruler{font-family:var(--f-ui);font-size:12px}

/* exercises */
.ex{border-top:1px solid var(--rule);padding:16px 0}
.ex-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-family:var(--f-ui);font-size:14px}
.ex-h b{font-size:15px}
.tag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.case{background:var(--tool-soft);color:var(--tool)}
.tag.adv{background:var(--why-soft);color:var(--why)}
.done{font-size:12px;color:var(--good);font-weight:600}
.hints{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.hint{background:var(--bg);border-radius:6px;padding:8px 12px;font-size:15px}
.hint::before{content:attr(data-label) " ";font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--muted)}
.check{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-family:var(--f-ui);font-size:13.5px}
.check input{font-family:var(--f-num);font-size:14px;width:9em;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink)}
.check .res{font-weight:600}
.res.ok{color:var(--good)} .res.no{color:var(--warn)}
.filter{display:flex;flex-wrap:wrap;gap:6px;margin:.8em 0}
.filter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

ol.errata{padding-left:1.4em;font-size:15.5px}
ol.errata li{margin:.4em 0}
footer{margin-top:4em;padding-top:1em;border-top:1px solid var(--rule);font-family:var(--f-ui);font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.pstep.reveal{animation:fade .35s ease}@keyframes fade{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>
<!-- ie-theme -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,300;0,8..144,500;0,8..144,600;1,8..144,300;1,8..144,500&family=Google+Sans+Flex:wght@400;500;600&display=swap');
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#2F3034; --muted:#6D6E71; --rule:#D6D6D6;
  --accent:#8C2F5A; --accent-soft:#FAF2F5;
  --why:#1A7F6E; --why-soft:#F1F7F5; --tool:#9A6110; --tool-soft:#FBF6EE;
  --warn:#A3392E; --warn-soft:#FBF1EF; --good:#2C7A47; --good-soft:#F0F7F2;
  --f-text:"Roboto Serif", Georgia, "Times New Roman", serif;
  --f-ui:"Google Sans Flex", system-ui, -apple-system, "Segoe UI", sans-serif;
}
body{font-weight:300; letter-spacing:.01em}
b, strong, th{font-weight:600}
h1, h2, h3, h4{font-family:var(--f-text); font-weight:500; letter-spacing:-.01em}
a{text-decoration:none}
th{background:#18181B; color:#fff; font-family:var(--f-ui); font-weight:500}
</style>
<!-- /ie-theme -->


<style>
html,body{background:var(--bg)}
body{margin:0;padding:12px}
.labpage{max-width:960px;margin:0 auto}
.labpage h1{font-size:20px;margin:0 0 4px}
.labpage .desc{margin:0 0 12px;font-size:14px}
.labpage .lab-band{margin:0;max-width:none}
.labpage .lab-grid{grid-template-columns:minmax(0,1fr)!important}
.labpage .lab-svg{max-width:640px}
.lab-hidden{display:none}
</style>

<body data-lab="contract">
<main class="labpage">
<h1>Contract lab</h1>
<p class="desc muted ui">Contracts in utility space with u(w) = sqrt(w). Change the environment and watch the first- and second-best contracts move.</p>
<div class="lab-band">
  <div class="lab-grid">
    <div class="ctrls">
      <div class="presets" role="group" aria-label="Presets">
        <button type="button" data-preset="nhs">NHS GP</button>
        <button type="button" data-preset="progressive">Progressive</button>
        <button type="button" data-preset="gap">Effort gap</button>
      </div>
      <div class="ctrl"><label for="muh"><span>\(\bar\mu\): Pr(good | high)</span><output id="o_muh"></output></label><input id="muh" type="range" min="0.05" max="0.95" step="0.01"></div>
      <div class="ctrl"><label for="mul"><span>\(\underline\mu\): Pr(good | low)</span><output id="o_mul"></output></label><input id="mul" type="range" min="0.05" max="0.95" step="0.01"></div>
      <div class="ctrl"><label for="cc"><span>\(c\): cost of high action (utils)</span><output id="o_cc"></output></label><input id="cc" type="range" min="0.05" max="2" step="0.01"></div>
      <div class="ctrl"><label for="u0"><span>\(u_0\): outside option (utils)</span><output id="o_u0"></output></label><input id="u0" type="range" min="1" max="20" step="0.1"></div>
      <div class="ctrl"><label for="yg"><span>\(y_g\): good output</span><output id="o_yg"></output></label><input id="yg" type="range" min="0" max="600" step="1"></div>
      <div class="ctrl"><label for="yb"><span>\(y_b\): bad output</span><output id="o_yb"></output></label><input id="yb" type="range" min="0" max="600" step="1"></div>
      <div class="msg" id="labMsg" role="status"></div>
    </div>
    <div class="lab-out">
      <svg class="lab-svg" id="labSvg" viewBox="0 0 520 340" role="img" aria-label="Contract space diagram"></svg>
      <div class="legend"><span><i style="border-color:var(--accent)"></i>(PC) high action</span><span><i style="border-color:var(--why)"></i>(IC)</span><span><i style="border-color:var(--muted);border-top-style:dashed"></i>full insurance</span><span><i style="border-color:var(--warn);border-top-style:dotted"></i>iso-cost through second best</span><span>shaded: contracts satisfying both</span></div>
      <div class="cards" id="labCards"></div>
      <div class="tbl"><table id="labTable"></table></div>
      <div class="ruler" id="labRuler"></div>
    </div>
  </div>
</div>
</main>
<script>
(function(){
/* ---------- contract lab ---------- */
  var P = {
    nhs:{muh:.65,mul:.35,cc:.3,u0:10,yg:400,yb:200},
    progressive:{muh:.9,mul:.7,cc:.4,u0:9.2,yg:100,yb:36},
    gap:{muh:.65,mul:.35,cc:.3,u0:10,yg:221,yb:200}
  };
  var ids = ['muh','mul','cc','u0','yg','yb'];
  var el = {}; ids.forEach(function(k){ el[k]=document.getElementById(k); });
  function load(name){ var p=P[name]; ids.forEach(function(k){ el[k].value=p[k]; }); update(); }
  document.querySelectorAll('[data-preset]').forEach(function(b){ b.addEventListener('click', function(){ load(b.dataset.preset); }); });
  ids.forEach(function(k){ el[k].addEventListener('input', update); });

  function f2(x){ return (Math.round(x*100)/100).toFixed(2); }
  function sg(x){ return (x<0?'−':'') + f2(Math.abs(x)); }
  var NS='http://www.w3.org/2000/svg';
  function mk(tag, attrs, parent){ var e=document.createElementNS(NS,tag); for (var a in attrs) e.setAttribute(a, attrs[a]); parent.appendChild(e); return e; }

  function update(){
    var v={}; ids.forEach(function(k){ v[k]=parseFloat(el[k].value); document.getElementById('o_'+k).textContent = (k==='yg'||k==='yb') ? v[k].toFixed(0) : v[k].toFixed(2); });
    var msg=document.getElementById('labMsg'); msg.textContent='';
    var cards=document.getElementById('labCards'), tbl=document.getElementById('labTable'), svg=document.getElementById('labSvg'), ruler=document.getElementById('labRuler');
    if (v.muh <= v.mul){ msg.textContent='Set Pr(good | high) above Pr(good | low): otherwise output says nothing about effort and no contract induces the high action.'; cards.innerHTML=''; tbl.innerHTML=''; ruler.innerHTML=''; while(svg.firstChild) svg.removeChild(svg.firstChild); return; }
    var dpi=v.muh-v.mul, d=v.cc/dpi, h=function(z){return z*z;};
    var zg=v.u0+(1-v.mul)*d, zb=v.u0-v.mul*d;
    var interior = zb >= 0;
    if (!interior) msg.textContent='Bad-state utility is negative, which √w cannot deliver (assumption A3 fails). A limited-liability floor would bind; see 3.8.3.';
    var Eyh=v.muh*v.yg+(1-v.muh)*v.yb, Eyl=v.mul*v.yg+(1-v.mul)*v.yb;
    var Cfb=h(v.u0+v.cc), Csb=v.muh*h(zg)+(1-v.muh)*h(zb), Clo=h(v.u0);
    var piFlat=Eyl-Clo, piFB=Eyh-Cfb, piSB=Eyh-Csb;
    var fbHigh = piFB>=piFlat, sbHigh = piSB>=piFlat;
    var AC=Csb-Cfb;
    var loss = (fbHigh? piFB:piFlat) - (sbHigh? piSB:piFlat);
    function pill(hi){ return '<span class="pill '+(hi?'p-high':'p-low')+'">'+(hi?'high action':'low action')+'</span>'; }
    cards.innerHTML =
      '<div class="kpi"><div class="k">First best induces</div><div class="s">'+pill(fbHigh)+'</div></div>'+
      '<div class="kpi"><div class="k">Second best induces</div><div class="s">'+pill(sbHigh)+'</div></div>'+
      '<div class="kpi"><div class="k">Agency cost of high action</div><div class="v">'+f2(AC)+'</div></div>'+
      '<div class="kpi"><div class="k">Welfare loss from hidden action</div><div class="v">'+f2(loss)+'</div><div class="s muted">'+(fbHigh&&sbHigh?'inefficient risk sharing':(fbHigh&&!sbHigh?'too little effort':'none'))+'</div></div>';
    tbl.innerHTML='<thead><tr><th>Contract</th><th class="n">z<sub>b</sub></th><th class="n">z<sub>g</sub></th><th class="n">w<sub>b</sub></th><th class="n">w<sub>g</sub></th><th class="n">E[w]</th><th class="n">Profit</th></tr></thead><tbody>'+
      '<tr><td>Full insurance, low action</td><td class="n">'+f2(v.u0)+'</td><td class="n">'+f2(v.u0)+'</td><td class="n">'+f2(Clo)+'</td><td class="n">'+f2(Clo)+'</td><td class="n">'+f2(Clo)+'</td><td class="n">'+sg(piFlat)+'</td></tr>'+
      '<tr><td>First best, high action</td><td class="n">'+f2(v.u0+v.cc)+'</td><td class="n">'+f2(v.u0+v.cc)+'</td><td class="n">'+f2(Cfb)+'</td><td class="n">'+f2(Cfb)+'</td><td class="n">'+f2(Cfb)+'</td><td class="n">'+sg(piFB)+'</td></tr>'+
      '<tr><td>Second best, high action</td><td class="n">'+f2(zb)+'</td><td class="n">'+f2(zg)+'</td><td class="n">'+f2(h(zb))+'</td><td class="n">'+f2(h(zg))+'</td><td class="n">'+f2(Csb)+'</td><td class="n">'+sg(piSB)+'</td></tr></tbody>';
    var g=dpi*(v.yg-v.yb), t1=Cfb-Clo, t2=Csb-Clo;
    ruler.innerHTML='Decision rule: compare the output gain \u0394\u03c0\u0394y = <b>'+f2(g)+'</b> with the first-best threshold <b>'+f2(t1)+'</b> and the second-best threshold <b>'+f2(t2)+'</b>. '+
      (g>=t2?'The gain clears both thresholds.':(g>=t1?'It clears the first-best threshold only: this is the under-provision region of Proposition 3.9.':'It clears neither.'));

    /* diagram */
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var W=520,H=340,L=46,R=14,T=14,B=36;
    var m0=v.u0+v.cc, span=Math.max(2.4*d,0.8), lo=m0-span, hi=m0+span*1.15;
    var X=function(z){return L+(z-lo)/(hi-lo)*(W-L-R);}, Y=function(z){return H-B-(z-lo)/(hi-lo)*(H-T-B);};
    var defs=mk('defs',{},svg), cp=mk('clipPath',{id:'clip'},defs); mk('rect',{x:L,y:T,width:W-L-R,height:H-T-B},cp);
    var css=getComputedStyle(document.documentElement);
    var col=function(n){return css.getPropertyValue(n).trim();};
    mk('line',{x1:L,y1:H-B,x2:W-R,y2:H-B,stroke:col('--muted'),'stroke-width':1},svg);
    mk('line',{x1:L,y1:T,x2:L,y2:H-B,stroke:col('--muted'),'stroke-width':1},svg);
    var ax=mk('text',{x:W-R,y:H-8,'text-anchor':'end',fill:col('--muted')},svg); ax.textContent='z_b (bad-state utility)';
    var ay=mk('text',{x:L+4,y:T+10,fill:col('--muted')},svg); ay.textContent='z_g';
    [lo, m0, hi].forEach(function(z,i){ var tx=mk('text',{x:X(z),y:H-B+14,'text-anchor':i===0?'start':'middle',fill:col('--muted')},svg); tx.textContent=z.toFixed(1); });
    var tl=mk('text',{x:L-4,y:Y(m0)+4,'text-anchor':'end',fill:col('--muted')},svg); tl.textContent=m0.toFixed(1);
    var gp=mk('g',{'clip-path':'url(#clip)'},svg);
    // feasible region: zg >= zb + d and muh zg + (1-muh) zb >= m0
    var pts=[]; var top=hi+5;
    pts.push([zb,zg]); pts.push([top-d,top]); pts.push([lo-5,top]);
    var zgPC=function(x){return (m0-(1-v.muh)*x)/v.muh;};
    pts.push([lo-5,zgPC(lo-5)]);
    mk('polygon',{points:pts.map(function(p){return X(p[0])+','+Y(p[1]);}).join(' '),fill:col('--why'),'fill-opacity':0.10},gp);
    mk('line',{x1:X(lo-5),y1:Y(lo-5),x2:X(top),y2:Y(top),stroke:col('--muted'),'stroke-dasharray':'4 4'},gp);
    mk('line',{x1:X(lo-5),y1:Y(zgPC(lo-5)),x2:X(top),y2:Y(zgPC(top)),stroke:col('--accent'),'stroke-width':2},gp);
    mk('line',{x1:X(lo-5),y1:Y(lo-5+d),x2:X(top),y2:Y(top+d),stroke:col('--why'),'stroke-width':2},gp);
    // iso-cost through SB
    var K=Csb, path='';
    for (var i=0;i<=80;i++){ var x=lo+(hi-lo)*i/80; var q=(K-(1-v.muh)*x*x)/v.muh; if(q<0) continue; var yv=Math.sqrt(q); path+=(path?'L':'M')+X(x).toFixed(1)+','+Y(yv).toFixed(1); }
    if(path) mk('path',{d:path,fill:'none',stroke:col('--warn'),'stroke-width':1.2,'stroke-dasharray':'2 3'},gp);
    mk('circle',{cx:X(m0),cy:Y(m0),r:5,fill:col('--accent')},gp);
    mk('circle',{cx:X(zb),cy:Y(zg),r:5,fill:col('--warn')},gp);
    var t3=mk('text',{x:X(m0)+8,y:Y(m0)+14,fill:col('--accent')},svg); t3.textContent='first best';
    var t4=mk('text',{x:X(zb)-8,y:Y(zg)-8,'text-anchor':'end',fill:col('--warn')},svg); t4.textContent='second best';
  }
  load('nhs');
  try { var mq=window.matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener('change', update); } catch(e){}
  new MutationObserver(update).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  
})();
</script>
